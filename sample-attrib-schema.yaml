GENOME:
  assembly:
    type: "String"

RESOURCE:
  aligner_index_dir:
    type: "Path"
  aligner_index_prefix:
    type: "String"
  chromsizes:
    type: "Path"

FILTERS:
  min_mapq:
    missingOK: true
    type: "Integer"
    default: 30
    min: 0
    max: 60
    purpose: "Minimum mapping quality for filtering."
    schema: "Restricted to the bwa aligner mapq range."

DATA:
  fastq:
    missingOK: true
    type: ["Path"]
    purpose: "For interleaved or single-end reads."
  fastq1:
    missingOK: true
    type: ["Path"]
    purpose: "R1 of paired-end reads."
  fastq2:
    missingOK: true
    type: ["Path"]
    purpose: "R2 of paired-end reads."
  sambam:
    required: true
    type: "Path"
  pairs:
    required: true
    type: "Path"
  hic:
    required: true
    type: "Path"
  mcool:
    required: true
    type: "Path"

ALIGN:
  input:
    id:
      source: "INTRINSIC"
    fastq1:
      source: "DATA"
      require_attribs: ["fastq2"]
      type: ["Path", "List"]
      default: []
      missingOK: false
      note: >
        To pass optional paths in a Nextflow process input tuple, we can pass
        an empty list. See https://github.com/nextflow-io/nextflow/issues/1694#issuecomment-789334369
    fastq2:
      source: "DATA"
      require_attribs: ["fastq1"]
      type: ["Path", "List"]
      default: []
      missingOK: false
      note: >
        To pass optional paths in a Nextflow process input tuple, we can pass
        an empty list. See https://github.com/nextflow-io/nextflow/issues/1694#issuecomment-789334369
    fastq:
      source: "DATA"
      type: ["Path", "List"]
      default: []
      missingOK: false
      note: >
        To pass optional paths in a Nextflow process input tuple, we can pass
        an empty list. See https://github.com/nextflow-io/nextflow/issues/1694#issuecomment-789334369
    aligner:
      type: "String"
      choices: ["bwa mem", "bwa-mem2", "bwameth", "bwameth-mem2"]
    aligner_index_dir:
      source: "RESOURCE"
    aligner_index_prefix:
      source: "RESOURCE"
    align_opts:
      default: {}
      type: "Map"
    min_mapq:
      source: "FILTERS"

PARSE_TO_PAIRS:
  input:
    id:
      source: "INTRINSIC"
    sambam:
      source: "DATA"
    chromsizes:
      source: "RESOURCE"
    assembly:
      source: "GENOME"
    parse_to_pairs_opts:
      default: {}
      type: "Map"
    minMapq:
      source: "FILTERS"

INTRINSIC:
  id:
    type: "String"
    purpose: "Unique sample identifier, typically auto-constructed by Hich from condition_biorep_techrep."